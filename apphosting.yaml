# Firebase App Hosting (Cloud Run underneath). Prep for the GCP move: Vercel
# keeps deploying until the cutover, and nothing here affects it.
# Schema: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Scale to zero between visits; a cold start costs one slow first request.
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # AdSense is env-gated (see CLAUDE.md). Both values are public ids, inlined
  # at build time, so they need BUILD availability. Leave them unset on any
  # non-production backend to keep ads off.
  - variable: NEXT_PUBLIC_ADSENSE_CLIENT
    value: ''
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ADSENSE_SLOT
    value: ''
    availability: [BUILD, RUNTIME]
